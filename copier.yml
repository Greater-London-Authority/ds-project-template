_subdirectory: template

project_type:
  type: str
  help: |
    What kind of project is this?

    scripts  — A standalone analysis (report, model, one-off dataset). Scripts and
               notebooks only. No package, no tests directory.

    analysis — A standalone analysis that also contains an internal Python package
               (src/ layout) and tests. Use this when you want to organise reusable
               code within a single project, but do not intend to publish it.

    package  — A shared library intended to be pip-installed by other projects
               (e.g. gla-data, hsds-box). Includes publishing, versioning, and
               type-checking tooling. Use this when starting a new shared package
               or contributing a standalone subpackage alongside gla-hsds work.
  choices:
    "Standalone analysis — scripts and notebooks only": scripts
    "Standalone analysis — with internal package and tests": analysis
    "Shared library — pip-installable (e.g. gla-data, hsds-box)": package
  default: analysis

package_name:
  type: str
  help: "Project name (hyphens ok, e.g. housing-projections)"

import_name:
  type: str
  help: "Importable Python name (underscores, e.g. housing_projections)"
  default: "{{ package_name | replace('-', '_') }}"
  when: "{{ project_type != 'scripts' }}"

description:
  type: str
  help: "One-line description of the project"

author_name:
  type: str
  help: "Author full name"

author_email:
  type: str
  help: "Author email address"

has_cli:
  type: bool
  help: "Does this project need a CLI entry point?"
  default: false
  when: "{{ project_type != 'scripts' }}"

python_version:
  type: str
  help: "Minimum Python version"
  default: "3.12"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"

platforms:
  type: str
  help: "Target pixi platforms (as TOML array string)"
  default: '["osx-arm64", "linux-64", "win-64"]'

_exclude:
  - "{% if project_type == 'scripts' %}src{% endif %}"
  - "{% if project_type == 'scripts' %}tests{% endif %}"
