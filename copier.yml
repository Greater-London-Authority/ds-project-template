_subdirectory: template

project_type:
  type: str
  help: |
    What kind of project is this?

    analysis — A standalone analysis (report, model, one-off dataset). Scripts and
               notebooks only. No src/ package, no tests directory.

    project  — A standalone project with an internal Python package (src/ layout)
               and tests. Use this when you want to organise reusable code within a
               single project, but do not intend to share it with other teams.

    package  — A shared library for use by other projects, teams, or people —
               whether published to PyPI or used internally (e.g. gla-data,
               hsds-box). Includes publishing, versioning, and type-checking tooling.
  choices:
    "Standalone analysis — scripts and notebooks only": analysis
    "Standalone project — with internal package and tests": project
    "Shared library — for use by other projects or teams": package
  default: project

package_name:
  type: str
  help: "Project name (hyphens ok, e.g. housing-projections)"

import_name:
  type: str
  help: "Importable Python name (underscores, e.g. housing_projections)"
  default: "{{ package_name | replace('-', '_') }}"
  when: "{{ project_type != 'analysis' }}"

description:
  type: str
  help: "One-line description of the project"

author_name:
  type: str
  help: "Author full name"

author_email:
  type: str
  help: "Author email address"

has_cli:
  type: bool
  help: "Does this project need a CLI entry point?"
  default: false
  when: "{{ project_type != 'analysis' }}"

uses_gla_data:
  type: bool
  help: "Does this project read GLA databases or S3 data through gla-data?"
  default: false

has_claude_md:
  type: bool
  help: "Add a CLAUDE.md (instructions for Claude Code)?"
  default: false

python_version:
  type: str
  help: "Minimum Python version"
  default: "3.12"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"

platforms:
  type: str
  multiselect: true
  help: "Target platforms"
  choices:
    - osx-arm64
    - osx-64
    - linux-64
    - win-64
  default:
    - osx-arm64
    - linux-64
    - win-64

_exclude:
  - "{% if project_type == 'analysis' %}src{% else %}.exclude-placeholder{% endif %}"
  - "{% if project_type == 'analysis' %}tests{% else %}.exclude-placeholder{% endif %}"
  - "{% if project_type == 'package' %}data{% else %}.exclude-placeholder{% endif %}"
  - "{% if project_type == 'package' %}notebooks{% else %}.exclude-placeholder{% endif %}"
  - "{% if project_type == 'package' %}outputs{% else %}.exclude-placeholder{% endif %}"
  - "{% if not has_cli %}src/*/cli.py{% else %}.exclude-placeholder{% endif %}"
  - "{% if project_type != 'project' %}experiments{% else %}.exclude-placeholder{% endif %}"
  - "{% if project_type == 'analysis' %}docs/decisions{% else %}.exclude-placeholder{% endif %}"
  - "{% if not has_claude_md %}CLAUDE.md{% else %}.exclude-placeholder{% endif %}"
  # No CI for analyses, or when no target platform has a GitHub-hosted runner (osx-64 only).
  - "{% if project_type == 'analysis' or not ('linux-64' in platforms or 'win-64' in platforms or 'osx-arm64' in platforms) %}.github{% else %}.exclude-placeholder{% endif %}"
